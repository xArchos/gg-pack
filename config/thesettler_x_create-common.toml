#Enable extra debug logging for TheSettler_x_Create.
#This is the flow trace only. Problems the mod could not handle are logged as
#warnings tagged [CreateShop][problem] whether this is on or off.
debugLogging = false
#Minimum Create Shop level required to order for a Colony Factory Gauge.
# Default: 2
# Range: 1 ~ 5
gaugeMinBuildingLevel = 2
#Cooldown (ticks) between missing network warning messages.
# Default: 6000
# Range: 20 ~ 24000
missingNetworkWarningCooldown = 6000
#Cooldown (ticks) between rack-full warning messages.
# Default: 6000
# Range: 20 ~ 24000
rackFullWarningCooldown = 6000
#Free slots the shopkeeper keeps in the rack a Create packager unpacks into. Create
#unpacks an arriving package into exactly one rack, so that one rack is the shop's
#inbound bottleneck: once it is full, nothing else arrives and the goods wait in the
#network. Below this many free slots the shopkeeper carries goods from it into the
#shop's other racks. 0 turns it off.
# Default: 5
# Range: 0 ~ 27
arrivalRackMinFreeSlots = 5
#Ticks unreserved stock must sit in the Create Shop racks before the shopkeeper
#moves it to the hut for a warehouse pickup.
# Default: 6000
# Range: 0 ~ 72000
housekeepingMinAgeTicks = 6000
#Cooldown (ticks) between courier debug logs.
# Default: 200
# Range: 0 ~ 24000
courierDebugCooldown = 200
#Cooldown (ticks) between courier entity debug logs.
# Default: 400
# Range: 0 ~ 24000
courierEntityDebugCooldown = 400
#Cooldown (ticks) for avoiding duplicate Create Shop request ordering.
# Default: 6000
# Range: 20 ~ 24000
orderTtlTicks = 6000
#Ticks before a Create Shop network request is considered overdue.
# Default: 6000
# Range: 20 ~ 24000
inflightTimeoutTicks = 6000
#Ticks between Create Shop inflight tracking checks.
# Default: 100
# Range: 20 ~ 24000
inflightCheckIntervalTicks = 100
#Cooldown (ticks) between inflight overdue logs.
# Default: 200
# Range: 0 ~ 24000
inflightLogCooldown = 200
#Cooldown (ticks) for pending delivery notices.
# Default: 200
# Range: 20 ~ 24000
pendingNoticeCooldown = 200
#Cooldown (ticks) between pending delivery debug logs.
# Default: 200
# Range: 0 ~ 24000
tickPendingDebugCooldown = 200
#Enable Create Shop chat messages.
chatMessagesEnabled = true
#Enable detailed Create Shop flow-step chat messages.
flowChatMessagesEnabled = false
#Cooldown (ticks) between performance timing summaries.
# Default: 200
# Range: 0 ~ 24000
perfLogCooldown = 200
#Ticks before a buffered-but-incomplete Create belt placement (waiting on the rest of its run) is considered abandoned and discarded instead of risking a collision with a later, unrelated belt run that resolves to the same buffer key.
# Default: 6000
# Range: 20 ~ 24000
beltPlacementBufferTtlTicks = 6000
#Enable the /thesettlerxcreate dev/test-harness commands (run_live_test, auto_test_harness*, diag_*, test_output_packaging). These create fake requests and inflight data in live colonies and are meant for development servers only, so they default to disabled even for operators.
enableDevTestCommands = false
